<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <title>思诺 · Gladys</title>
    <style>
        /* --- 基础设置 --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-color: #050505;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* --- 容器与图层 --- */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 默认不响应鼠标，让点击穿透 */
        }

        /* --- 背景层 --- */
        .bg-grid {
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(26, 26, 46, 0.5) 0%, rgba(0, 0, 0, 1) 100%),
                url('./imgs/bg_texture.png') no-repeat center center/cover;
            z-index: 1;
        }

        /* --- 人物层 --- */
        .character-layer {
            z-index: 5;
        }

        .character-img {
            width: 55vh;
            height: 55vh;
            margin-top: -12vh; /* 在居中基础上上移，为底部留出空间 */
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
            background: url('./imgs/snow_char.png') no-repeat center center/cover;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            pointer-events: auto; /* 允许点击人物 */
        }

        /* 旋转动画 + 中心镂空（在唱片上挖洞，中间真正透明） */
        .character-img.is-playing {
            animation: spin-record 10s linear infinite;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.7));
            /* 中心约 10% 半径挖空，与下方 .center-hole 大小一致 */
            mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
        }

        /* 中心孔洞：镂空（透明）+ 蓝色描边，不挡文字层 */
        .center-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20%;
            height: 20%;
            transform: translate(-50%, -50%) scale(0);
            background: transparent; /* 镂空，中心不涂黑，文字层可透出 */
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            overflow: hidden;
            z-index: 5;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px var(--neon-blue);
            pointer-events: none;
        }

        /* 播放时显示孔洞 */
        .character-img.is-playing .center-hole {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* 视频 iframe */
        #bili-player {
            width: 300%;
            height: 300%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        
        /* --- UI 文字层 --- */
        .ui-layer {
            z-index: 100;
            text-align: center;
            mix-blend-mode: overlay;
            isolation: isolate;
            pointer-events: none;
        }

        .glitch-title {
            position: relative;
            z-index: 1;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: white;
            text-shadow: 2px 2px var(--neon-purple);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-top: -20px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        /* --- 关注按钮（左上角，与右侧粉丝数对称）--- */
        .cta-container {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 220px;
            z-index: 110;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-blue);
            border-left: 5px solid var(--neon-blue);
            padding: 5px;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .cta-btn {
            display: block;
            padding: 12px 0;
            font-size: 1.4rem;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: bold;
            color: var(--neon-blue);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: transparent;
            border: none;
            transition: all 0.3s;
        }

        .cta-btn:hover {
            color: #000;
            background: var(--neon-blue);
            margin: 0 -15px;
            padding-left: 15px;
            padding-right: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        @keyframes spin-record {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- 统计面板 --- */
        .stats-panel {
            position: absolute; top: 5%; right: 5%; width: 220px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-blue);
            padding: 15px; text-align: right; border-right: 5px solid var(--neon-blue);
            pointer-events: auto; backdrop-filter: blur(5px); z-index: 110;
        }

        .stats-number {
            font-family: 'Courier New', monospace; font-size: 2.5rem;
            font-weight: bold; color: var(--neon-blue);
        }

        /* --- 播放控制栏：唱片与歌单之间 --- */
        .player-controls {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 420px;
            z-index: 95;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            border-left-width: 5px;
            backdrop-filter: blur(5px);
        }

        .player-controls .btn-play-pause {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            background: rgba(0, 243, 255, 0.08);
            color: var(--neon-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .player-controls .btn-play-pause:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .player-controls .mode-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-controls .btn-mode {
            padding: 8px 14px;
            font-size: 0.8rem;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid var(--neon-blue);
            background: transparent;
            color: var(--neon-blue);
            cursor: pointer;
            transition: all 0.25s;
            opacity: 0.6;
        }
        .player-controls .btn-mode:hover {
            opacity: 1;
        }
        .player-controls .btn-mode.active {
            background: rgba(0, 243, 255, 0.2);
            opacity: 1;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        /* 播放条与时间 */
        .player-controls {
            flex-direction: column;
            gap: 10px;
        }
        .player-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .player-progress-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-progress-wrap .time {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            min-width: 2.8em;
            text-align: center;
        }
        .player-progress-wrap .time-total {
            color: rgba(0, 243, 255, 0.7);
        }
        .player-progress-wrap .progress-bar {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 243, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }
        .player-progress-wrap .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-blue);
            transition: transform 0.15s;
        }
        .player-progress-wrap .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        .player-progress-wrap .progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        .player-progress-wrap .progress-bar::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--neon-blue) 0%, var(--neon-blue) var(--progress, 0%), transparent var(--progress, 0%));
        }
        .player-progress-wrap .progress-bar::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 243, 255, 0.15);
        }
        .player-progress-wrap .progress-bar::-moz-range-progress {
            height: 6px;
            border-radius: 3px;
            background: var(--neon-blue);
        }

        /* --- 底部滚动歌名：80% 宽，位于底部留白处 --- */
        .song-ticker-wrap {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 48px;
            z-index: 90;
            pointer-events: auto;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--neon-blue);
            border-right: 1px solid var(--neon-blue);
            border-bottom: 1px solid var(--neon-blue);
            border-left: 5px solid var(--neon-blue);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
        }

        .song-ticker-label {
            flex-shrink: 0;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-transform: uppercase;
            padding: 0 20px;
            border-right: 1px solid rgba(0, 243, 255, 0.4);
            margin-right: 12px;
        }

        .song-ticker-track {
            flex: 1;
            overflow: hidden;
            min-width: 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 避免触摸拖动时整页滚动 */
        }

        .song-ticker-track.dragging {
            cursor: grabbing;
        }

        .song-ticker-inner {
            display: inline-flex;
            align-items: center;
            gap: 0;
            white-space: nowrap;
            will-change: transform;
        }

        .song-ticker-inner .song-item {
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            padding: 0 24px;
            cursor: pointer;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .song-ticker-inner .song-item:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .song-ticker-inner .song-item.current {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .song-ticker-inner .song-sep {
            color: var(--neon-blue);
            opacity: 0.6;
            font-size: 0.9rem;
            padding: 0 8px;
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            .glitch-title { font-size: 3rem; }
            .character-img { width: 42vh; height: 42vh; margin-top: -8vh; }
            .cta-container { width: 180px; }
            .cta-btn { font-size: 1.1rem; }
            .player-controls { bottom: 16%; width: 90%; max-width: none; padding: 10px 14px; gap: 8px; }
            .player-controls .btn-play-pause { width: 42px; height: 42px; font-size: 1.25rem; }
            .player-controls .btn-mode { padding: 6px 10px; font-size: 0.7rem; }
            .player-progress-wrap .time { font-size: 0.7rem; }
            .player-progress-wrap .progress-bar { height: 5px; }
            .player-progress-wrap .progress-bar::-webkit-slider-thumb { width: 12px; height: 12px; }
            .player-progress-wrap .progress-bar::-moz-range-thumb { width: 12px; height: 12px; }
            .song-ticker-wrap { width: 90%; bottom: 8%; height: 40px; }
            .song-ticker-label { padding: 0 12px; font-size: 0.65rem; }
            .song-ticker-inner .song-item { font-size: 1rem; padding: 0 16px; }
        }

    </style>
</head>
<body>

    <div id="scene">
        <div class="layer">
            <div class="bg-grid"></div>
        </div>

        <div class="layer character-layer">
            <div class="character-img">
                <div class="center-hole">
                    <!-- <iframe id="bili-video-frame" 
                        src="" 
                        scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true">
                    </iframe> -->
                </div>
            </div>
        </div>

        <!-- 文字层放在唱片层之后，保证始终叠在孔洞之上 -->
        <div class="layer ui-layer">
            <h1 class="glitch-title">思诺 Gladys</h1>
            <p class="subtitle">Z.J. ENTERTAINMENT</p>
        </div>
        
        <div class="cta-container">
            <a href="https://space.bilibili.com/3537115310721781" target="_blank" class="cta-btn">
                关注思诺SNOW
            </a>
        </div>

        <div class="stats-panel">
            <span style="font-size:0.8rem; color:#aaa;">BILIBILI FOLLOWERS</span>
            <span class="stats-number" id="fan-count">loading...</span>
        </div>

        <!-- 播放控制：唱片与歌单之间 -->
        <div class="player-controls">
            <div class="player-controls-row">
                <button type="button" class="btn-play-pause" id="btn-play-pause" title="播放 / 暂停" aria-label="播放暂停">▶</button>
                <div class="mode-group">
                    <button type="button" class="btn-mode" id="btn-mode-list" data-mode="list" title="列表循环">列表循环</button>
                    <button type="button" class="btn-mode" id="btn-mode-single" data-mode="single" title="单曲循环">单曲循环</button>
                    <button type="button" class="btn-mode" id="btn-mode-random" data-mode="random" title="随机播放">随机循环</button>
                </div>
            </div>
            <div class="player-progress-wrap">
                <span class="time time-current" id="time-current">0:00</span>
                <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1" title="拖动调节进度">
                <span class="time time-total" id="time-total">0:00</span>
            </div>
        </div>

        <!-- 底部滚动歌名（数据来自 songs.json） -->
        <div class="song-ticker-wrap" id="song-ticker-wrap">
            <span class="song-ticker-label">♪ TRACK LIST</span>
            <div class="song-ticker-track">
                <div class="song-ticker-inner" id="song-ticker-inner">
                    <span class="song-item">加载中...</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 0. 配置中心 ---
        // 如果你绑定了 api.snow-gladys.com，请使用下面第一行
        const API_BASE = 'https://api.snow-gladys.com'; 
        // 如果没绑定成功，暂时用 Worker 原生地址：
        // const API_BASE = 'https://snow-api-proxy.pengyiteng0827.workers.dev'; 

        // --- 1. 获取粉丝数逻辑 ---
        const fanCountElement = document.getElementById('fan-count');
        
        async function fetchFanCount() {
            try {
                // 注意：这里请求的是 /fans 路径
                const response = await fetch(`${API_BASE}/fans`);
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                if (data.code === 0) {
                    fanCountElement.innerText = data.data.follower.toLocaleString();
                }
            } catch (error) {
                console.error("Worker 代理请求失败");
                fanCountElement.innerText = 'xxxxx';
                fanCountElement.style.color = 'rgba(0, 243, 255, 0.5)';
            }
        }

        // 初始化加载
        fetchFanCount();

        // 每60秒刷新
        setInterval(fetchFanCount, 60000);

    </script>
</body>
</html>
