<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <title>思诺 · Gladys</title>
    <style>
        /* --- 基础设置 --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-color: #050505;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* --- 容器与图层 --- */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 默认不响应鼠标，让点击穿透 */
        }

        /* --- 背景层 --- */
        .bg-grid {
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(26, 26, 46, 0.5) 0%, rgba(0, 0, 0, 1) 100%),
                url('./imgs/bg_texture.png') no-repeat center center/cover;
            z-index: 1;
        }

        /* --- 人物层：z-index 高于 view-home，保证中央唱片可点，底部按钮仍在 view-home 上可点 --- */
        .character-layer {
            z-index: 15;
        }

        .character-img {
            width: 55vh;
            height: 55vh;
            margin-top: -12vh; /* 在居中基础上上移，为底部留出空间 */
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
            background: url('./imgs/snow_char.png') no-repeat center center/cover;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            pointer-events: auto; /* 允许点击人物 */
        }

        /* 旋转动画 + 中心镂空（在唱片上挖洞，中间真正透明） */
        .character-img.is-playing {
            animation: spin-record 10s linear infinite;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.7));
            /* 中心约 10% 半径挖空，与下方 .center-hole 大小一致 */
            mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
        }

        /* 中心孔洞：镂空（透明）+ 蓝色描边，不挡文字层 */
        .center-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20%;
            height: 20%;
            transform: translate(-50%, -50%) scale(0);
            background: transparent; /* 镂空，中心不涂黑，文字层可透出 */
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            overflow: hidden;
            z-index: 5;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px var(--neon-blue);
            pointer-events: none;
        }

        /* 播放时显示孔洞 */
        .character-img.is-playing .center-hole {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* 视频 iframe */
        #bili-player {
            width: 300%;
            height: 300%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        
        /* --- UI 文字层 --- */
        .ui-layer {
            z-index: 100;
            text-align: center;
            mix-blend-mode: overlay;
            isolation: isolate;
            pointer-events: none;
        }

        .glitch-title {
            position: relative;
            z-index: 1;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: white;
            text-shadow: 2px 2px var(--neon-purple);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-top: -20px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        /* --- 视图切换：首页 z-index 高于唱片层，文字叠在图片上且唱片不可点 --- */
        .view-home { position: absolute; inset: 0; z-index: 20; pointer-events: auto; }
        .view-home .home-buttons { position: absolute; bottom: 14%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: row; gap: 16px; z-index: 95; }
        .view-home .home-btn {
            padding: 14px 28px; font-size: 1.1rem; font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif; font-weight: 700;
            letter-spacing: 3px; color: var(--neon-blue); background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-blue);
            border-left-width: 5px; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(5px);
        }
        .view-home .home-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .view-playlist {
            position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center;
            padding: 12px; box-sizing: border-box; pointer-events: none;
        }
        .view-playlist.is-open { display: flex; pointer-events: auto; }
        .playlist-backdrop {
            position: absolute; inset: 0; background: rgba(5, 5, 5, 0.9); pointer-events: auto;
        }
        .playlist-panel {
            position: relative; width: 100%; max-width: 420px; max-height: 75vh; overflow: hidden;
            background: rgba(10, 10, 20, 0.85); border: 1px solid var(--neon-blue); border-left: 5px solid var(--neon-blue);
            border-radius: 8px; backdrop-filter: blur(12px); box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
            display: flex; flex-direction: column; pointer-events: auto;
        }
        .playlist-header {
            padding: 10px 14px; border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            font-size: 0.7rem; letter-spacing: 3px; color: var(--neon-blue); text-transform: uppercase;
        }
        .playlist-search-wrap {
            position: relative; padding: 10px 14px; border-bottom: 1px solid rgba(0, 243, 255, 0.25); flex-shrink: 0;
            display: flex; align-items: center; gap: 8px;
        }
        .playlist-search-wrap::before { content: '🔍'; position: absolute; left: 22px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.7; pointer-events: none; }
        .playlist-search { flex: 1; min-width: 0;
            padding: 10px 14px; padding-left: 36px; box-sizing: border-box;
            font-size: 0.95rem; font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            color: #fff; background: rgba(0, 243, 255, 0.06); border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .playlist-search::placeholder { color: rgba(255, 255, 255, 0.4); }
        .playlist-search:focus { border-color: var(--neon-blue); box-shadow: 0 0 12px rgba(0, 243, 255, 0.2); }
        .playlist-filter-btn {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.4);
            background: rgba(0, 243, 255, 0.06); color: var(--neon-blue); cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .playlist-filter-btn:hover { background: rgba(0, 243, 255, 0.15); }
        .playlist-filter-btn .icon-svg { width: 20px; height: 20px; }
        .playlist-filter-btn .icon-star-filled { display: none; }
        .playlist-filter-btn.active .icon-star-outline { display: none; }
        .playlist-filter-btn.active .icon-star-filled { display: block; }
        .playlist-list {
            overflow-y: auto; padding: 4px 0; -webkit-overflow-scrolling: touch;
        }
        .playlist-item {
            display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 16px; text-align: left;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif; font-weight: 700; font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9); background: transparent; border: none; cursor: pointer;
            transition: background 0.2s, color 0.2s; border-left: 3px solid transparent;
        }
        .playlist-item .playlist-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .playlist-item .playlist-item-star { flex-shrink: 0; color: var(--neon-blue); font-size: 0.75rem; opacity: 0.9; }
        .playlist-item:hover { background: rgba(0, 243, 255, 0.08); color: var(--neon-blue); }
        .playlist-item.current { color: var(--neon-blue); border-left-color: var(--neon-blue); background: rgba(0, 243, 255, 0.12); }
        .view-play {
            position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 8%; pointer-events: none;
        }
        .view-play.is-active { display: flex; pointer-events: auto; }
        .view-play > * { pointer-events: auto; }
        .play-song-name {
            position: absolute; left: 50%; transform: translateX(-50%); width: 92%; text-align: center;
            bottom: 24%; font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif; font-weight: 700; font-size: 1.85rem;
            color: var(--neon-blue); text-shadow: 0 0 20px rgba(0, 243, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .play-progress-wrap {
            width: 88%; max-width: 380px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .play-progress-wrap .time { font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--neon-blue); min-width: 2.8em; text-align: center; }
        .play-progress-wrap .progress-bar {
            flex: 1; min-width: 0; height: 6px; -webkit-appearance: none; appearance: none;
            background: transparent; border-radius: 3px; outline: none; padding: 0; margin: 0;
        }
        .play-progress-wrap .progress-bar::-webkit-slider-runnable-track {
            height: 6px; border-radius: 3px; margin: 0;
            background: linear-gradient(to right, var(--neon-blue) 0%, var(--neon-blue) var(--progress, 0%), rgba(0, 243, 255, 0.15) var(--progress, 0%));
        }
        .play-progress-wrap .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4px; border-radius: 50%;
            background: var(--neon-blue); cursor: pointer; box-shadow: 0 0 8px var(--neon-blue);
        }
        .play-progress-wrap .progress-bar::-moz-range-track {
            height: 6px; border-radius: 3px; background: rgba(0, 243, 255, 0.15);
        }
        .play-progress-wrap .progress-bar::-moz-range-progress {
            height: 6px; border-radius: 3px; background: var(--neon-blue);
        }
        .play-progress-wrap .progress-bar::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; border: none;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        .play-controls {
            display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
        }
        .play-controls .btn-icon {
            width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--neon-blue); background: rgba(0, 243, 255, 0.08);
            color: var(--neon-blue); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .play-controls .btn-icon .icon-svg { width: 22px; height: 22px; flex-shrink: 0; }
        .play-controls .btn-icon:hover { background: var(--neon-blue); color: #000; }
        .play-controls .btn-icon.btn-play { width: 52px; height: 52px; }
        .play-controls .btn-icon.btn-play .icon-svg { width: 28px; height: 28px; }
        .play-controls .btn-icon.btn-play .icon-pause { display: none; }
        .play-controls .btn-icon.btn-play.is-playing .icon-play { display: none; }
        .play-controls .btn-icon.btn-play.is-playing .icon-pause { display: block; }
        .play-controls .btn-icon.btn-fav .icon-star-filled { display: none; }
        .play-controls .btn-icon.btn-fav.is-fav .icon-star-outline { display: none; }
        .play-controls .btn-icon.btn-fav.is-fav .icon-star-filled { display: block; }
        .play-controls .btn-mode-cycle {
            padding: 8px 14px; min-width: 56px; font-size: 0.75rem; font-family: 'Rajdhani', sans-serif; font-weight: 700;
            border: 1px solid var(--neon-blue); background: rgba(0, 243, 255, 0.1); color: var(--neon-blue); cursor: pointer;
            border-radius: 6px; transition: all 0.2s;
        }
        .play-controls .btn-mode-cycle:hover { background: rgba(0, 243, 255, 0.2); }

        /* 网页端：拉大歌名与唱片、进度条与按钮的间距，不影响移动端 */
        @media (min-width: 769px) {
            .view-play { padding-bottom: 2%; }
            .play-song-name { bottom: 20%; }
            .play-progress-wrap { margin-bottom: 20px; }
            .play-controls { margin-top: 6px; }
        }

        @media (max-width: 768px) {
            .view-home .home-buttons { flex-direction: column; bottom: 24%; gap: 12px; }
            .view-home .home-btn { padding: 12px 22px; font-size: 1rem; }
            .view-play { padding-bottom: 30%; }
            .play-song-name { font-size: 1.5rem; bottom: 36%; }
            .play-controls .btn-icon { width: 40px; height: 40px; font-size: 1.1rem; }
            .play-controls .btn-icon.btn-play { width: 48px; height: 48px; }
            .view-playlist { justify-content: flex-start; padding-top: 4%; align-items: center; }
            .view-playlist .playlist-panel { max-height: 72vh; }
        }

        /* --- 关注按钮（左上角，与右侧粉丝数对称）--- */
        .cta-container {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 220px;
            z-index: 110;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-blue);
            border-left: 5px solid var(--neon-blue);
            padding: 5px;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .cta-btn {
            display: block;
            padding: 12px 0;
            font-size: 1.4rem;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: bold;
            color: var(--neon-blue);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: transparent;
            border: none;
            transition: all 0.3s;
        }

        .cta-btn:hover {
            color: #000;
            background: var(--neon-blue);
            margin: 0 -15px;
            padding-left: 15px;
            padding-right: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        @keyframes spin-record {
            from { transform: rotate(var(--start-deg, 0deg)); }
            to { transform: rotate(calc(var(--start-deg, 0deg) + 360deg)); }
        }

        /* --- 左上角：跳转另一播放器 --- */
        .nav-emoji-link {
            position: absolute; top: 5%; left: 5%; z-index: 200;
            font-size: 1.8rem; line-height: 1; text-decoration: none; cursor: pointer;
            opacity: 0.85; transition: opacity 0.2s;
        }
        .nav-emoji-link:hover { opacity: 1; }

        /* --- 统计面板 --- */
        .stats-panel {
            position: absolute; top: 5%; right: 5%; width: 160px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-blue);
            padding: 10px 12px; text-align: right; border-right: 4px solid var(--neon-blue);
            pointer-events: auto; backdrop-filter: blur(5px); z-index: 110;
        }

        .stats-panel .stats-label {
            font-size: 0.7rem; color: #aaa; display: block;
        }
        .stats-number {
            font-family: 'Courier New', monospace; font-size: 1.85rem;
            font-weight: bold; color: var(--neon-blue);
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            .glitch-title { font-size: 3rem; margin-top: -20vh; }
            .subtitle { margin-top: -20px; }
            .character-img { width: 42vh; height: 42vh; margin-top: -26vh; }
            .stats-panel { width: 120px; padding: 6px 10px; border-right-width: 3px; }
            .stats-panel .stats-label { font-size: 0.6rem; }
            .stats-number { font-size: 1.35rem; }
            .view-home .home-buttons { flex-direction: column; bottom: 24%; gap: 12px; }
            .view-home .home-btn { padding: 10px 20px; font-size: 0.95rem; min-width: 160px; }
            .view-play { padding-bottom: 30%; }
            .view-play .play-song-name { font-size: 1.35rem; bottom: 36%; }
            .view-play .play-controls { padding: 10px 12px; gap: 8px; }
            .view-play .play-controls .btn-play { width: 44px; height: 44px; font-size: 1.3rem; }
            .view-play .play-controls .btn-icon { width: 36px; height: 36px; font-size: 1rem; }
            .view-play .play-controls .btn-mode-cycle { padding: 6px 10px; font-size: 0.7rem; min-width: 48px; }
            .play-progress-wrap .time { font-size: 0.7rem; }
            .play-progress-wrap .progress-bar { height: 5px; }
            .play-progress-wrap .progress-bar::-webkit-slider-thumb { width: 12px; height: 12px; }
            .play-progress-wrap .progress-bar::-moz-range-thumb { width: 12px; height: 12px; }
        }

    </style>
</head>
<body>

    <div id="scene">
        <div class="layer">
            <div class="bg-grid"></div>
        </div>

        <div class="layer character-layer">
            <div class="character-img">
                <div class="center-hole">
                    <!-- <iframe id="bili-video-frame" 
                        src="" 
                        scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true">
                    </iframe> -->
                </div>
            </div>
        </div>

        <a class="nav-emoji-link" href="./fiona/" title="去心怡">🦭</a>

        <!-- 主页面：图片、文字、粉丝数、两个按钮 -->
        <div class="view-home" id="view-home">
            <div class="layer ui-layer">
                <h1 class="glitch-title">思诺 Gladys</h1>
                <p class="subtitle">Z.J. ENTERTAINMENT</p>
            </div>
            <div class="stats-panel">
                <span class="stats-label">BILIBILI FOLLOWERS</span>
                <span class="stats-number" id="fan-count">loading...</span>
            </div>
            <div class="home-buttons">
                <button type="button" class="home-btn" id="btn-open-playlist">查看歌单</button>
                <button type="button" class="home-btn" id="btn-play-random">随机一首</button>
            </div>
        </div>

        <!-- 歌单页（半透明 90%） -->
        <div class="view-playlist" id="view-playlist">
            <div class="playlist-backdrop" id="playlist-backdrop"></div>
            <div class="playlist-panel">
                <div class="playlist-header">♪ 歌单 · <span id="playlist-count">0</span> 首</div>
                <div class="playlist-search-wrap">
                    <input type="text" class="playlist-search" id="playlist-search" placeholder="搜索歌曲" autocomplete="off">
                    <button type="button" class="playlist-filter-btn" id="playlist-filter-btn" title="只看收藏">
                        <svg class="icon-svg icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <svg class="icon-svg icon-star-filled" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </button>
                </div>
                <div class="playlist-list" id="playlist-list"></div>
            </div>
        </div>

        <!-- 播放页：进度条、歌名、唱片、五键 -->
        <div class="view-play" id="view-play">
            <div class="play-song-name" id="play-song-name">—</div>
            <div class="play-progress-wrap">
                <span class="time" id="time-current">0:00</span>
                <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1">
                <span class="time time-total" id="time-total">0:00</span>
            </div>
            <div class="play-controls">
                <button type="button" class="btn-mode-cycle" id="btn-mode-cycle" title="播放模式">列表循环</button>
                <button type="button" class="btn-icon" id="btn-prev" title="上一首">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6V6zm4.5 6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button type="button" class="btn-icon btn-play" id="btn-play-pause" title="播放/暂停">
                    <svg class="icon-svg icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
                    <svg class="icon-svg icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button type="button" class="btn-icon" id="btn-next" title="下一首">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2V6zM5 6v12l8.5-6-8.5-6z"/></svg>
                </button>
                <button type="button" class="btn-icon btn-fav" id="btn-fav" title="收藏">
                    <svg class="icon-svg icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <svg class="icon-svg icon-star-filled" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

        // --- 1.5 收藏 Cookie（尽量长久保存：每次进入与每次改动都重写 cookie 续期）---
        const FAV_COOKIE = 'sg_fav';
        const FAV_MAX_AGE = 365 * 24 * 60 * 60; // 1 年
        let favoritesSet = new Set();

        function getFavoritesFromCookie() {
            try {
                const raw = document.cookie.split(';').map(s => s.trim()).find(s => s.startsWith(FAV_COOKIE + '='));
                if (!raw) return new Set();
                const eq = raw.indexOf('=');
                const valueStr = eq >= 0 ? raw.substring(eq + 1).trim() : '';
                if (!valueStr) return new Set();
                const value = decodeURIComponent(valueStr);
                const arr = JSON.parse(value || '[]');
                if (!Array.isArray(arr)) return new Set();
                return new Set(arr.filter(Boolean).map(s => String(s).toUpperCase()));
            } catch (e) { return new Set(); }
        }

        function saveFavoritesToCookie() {
            try {
                const arr = Array.from(favoritesSet);
                const value = encodeURIComponent(JSON.stringify(arr));
                document.cookie = FAV_COOKIE + '=' + value + '; path=/; max-age=' + FAV_MAX_AGE + '; SameSite=Lax';
                return true;
            } catch (e) { return false; }
        }

        function toggleFavorite(bvid) {

            const wasFav = favoritesSet.has(key);

            else favoritesSet.add(key);
            if (!saveFavoritesToCookie()) {
                if (wasFav) favoritesSet.add(key);
                else favoritesSet.delete(key);
                alert('网页缓存在您的设备上是禁用的，无法使用收藏功能。');
                return;

            if (favoritesSet.size === 0 && playMode === 'favorites' && btnModeCycle) setPlayMode('list');

        function isFavorite(bvid) {
            return !!(bvid && favoritesSet.has((bvid || '').toUpperCase()));

        // 进入网站时读 cookie 并重写一次以延长过期
        favoritesSet = getFavoritesFromCookie();

        // --- 1.6 歌单与视图 ---

        function renderPlaylist() {
            if (!playlistListEl) return;

            if (playlistFilterFavorites) items = items.filter(({ s }) => isFavorite(s.bvid));
            if (query) {

                items.sort((a, b) => {
                    const na = (a.s.name || a.s.title || '').toLowerCase();
                    const nb = (b.s.name || b.s.title || '').toLowerCase();
                    const aStart = na.startsWith(query) ? 0 : 1;
                    const bStart = nb.startsWith(query) ? 0 : 1;
                    if (aStart !== bStart) return aStart - bStart;
                    return na.localeCompare(nb);

            playlistListEl.innerHTML = '';
            const total = playlistFilterFavorites ? songList.filter(s => isFavorite(s.bvid)).length : songList.length;

            const curBvid = (currentPlayingBvid || '').toUpperCase();

                btn.addEventListener('click', () => {
                    playMusic(s.bvid || '');
                    closePlaylist();
                    showView('play');
                });
                playlistListEl.appendChild(btn);
            });
        }

        document.getElementById('btn-open-playlist').addEventListener('click', () => openPlaylist());
        document.getElementById('btn-play-random').addEventListener('click', () => {
            if (!songList.length) return;

            playlistFilterBtn.addEventListener('click', () => {

        // --- 2. 纯音乐播放逻辑 (核心) ---
        const bgmAudio = new Audio();
        bgmAudio.crossOrigin = "anonymous"; // 允许跨域
        
        const characterImg = document.querySelector('.character-img');
        let currentPlayingBvid = '';  // 当前播放的 bvid

        /** 从元素的 computed transform 或 inline style 得到当前旋转角度（度） */
        function getRecordRotationDeg(el) {
            if (!el) return 0;
            const style = el.style.transform;
            if (style && style.includes('rotate')) {
                const m = style.match(/rotate\(([-\d.]+)deg\)/);
                if (m) return parseFloat(m[1]) || 0;
            }
            const computed = getComputedStyle(el).transform;
            if (!computed || computed === 'none') return 0;
            const parts = computed.replace(/^matrix\(|\)$/, '').split(',').map(s => parseFloat(s.trim()));
            if (parts.length >= 4) {
                const angle = Math.atan2(parts[1], parts[0]) * (180 / Math.PI);
                return angle;
            }
            return 0;
        }
        let playMode = 'list';        // 'list' | 'single' | 'random'

        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnModeCycle = document.getElementById('btn-mode-cycle');
        const timeCurrentEl = document.getElementById('time-current');
        const timeTotalEl = document.getElementById('time-total');
        const progressBarEl = document.getElementById('progress-bar');

        function formatTime(sec) {
            if (sec === undefined || sec === null || !isFinite(sec) || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateProgressDisplay() {
            const t = bgmAudio.currentTime;
            const d = bgmAudio.duration;
            timeCurrentEl.textContent = formatTime(t);
            if (isFinite(d) && d > 0) {
                timeTotalEl.textContent = formatTime(d);
                const p = (t / d) * 100;
                progressBarEl.value = p;
                progressBarEl.style.setProperty('--progress', p + '%');
            } else {
                timeTotalEl.textContent = '0:00';
                progressBarEl.value = 0;
                progressBarEl.style.setProperty('--progress', '0%');
            }
        }

        const MODE_LABELS = { list: '列表循环', single: '单曲循环', random: '随机播放', favorites: '播放收藏' };
        function setPlayMode(mode) {
            playMode = mode;
            if (btnModeCycle) {
                btnModeCycle.textContent = MODE_LABELS[mode] || mode;
                btnModeCycle.title = mode === 'favorites' ? '收藏列表循环' : mode === 'list' ? '列表循环' : mode === 'single' ? '单曲循环' : '随机播放';
            }
        }

        /** 收藏列表（保持 songList 顺序） */
        function getFavoritesList() {
            return songList.filter(s => isFavorite(s.bvid));
        }

        /** 当前模式下的可播列表 */
        function getEffectiveList() {
            if (playMode === 'favorites') return getFavoritesList();
            return songList;
        }

        /** 在当前模式列表中的下标，-1 表示不在列表中 */
        function getCurrentIndexInEffectiveList() {
            const list = getEffectiveList();
            if (!list.length || !currentPlayingBvid) return -1;
            const u = currentPlayingBvid.toUpperCase();
            return list.findIndex(s => (s.bvid || '').toUpperCase() === u);
        }

        function getCurrentIndex() {
            if (!currentPlayingBvid || !songList.length) return -1;
            const u = currentPlayingBvid.toUpperCase();
            return songList.findIndex(s => (s.bvid || '').toUpperCase() === u);
        }

        /** 在 [0, n) 内取随机索引；excludeIndex 若 >=0 则不选该索引（在其余 n-1 首里均匀随机） */
        function getRandomIndex(n, excludeIndex) {
            if (n <= 0) return 0;
            if (n === 1) return 0;
            const needExclude = excludeIndex >= 0 && excludeIndex < n && n > 1;
            const range = needExclude ? n - 1 : n;
            const useCrypto = typeof crypto !== 'undefined' && crypto.getRandomValues;
            let k;
            if (useCrypto) {
                const arr = new Uint32Array(1);
                crypto.getRandomValues(arr);
                k = arr[0] % range;
            } else {
                k = Math.floor(Math.random() * range);
            }
            if (needExclude) return k >= excludeIndex ? k + 1 : k;
            return k;
        }

        function playNextByMode() {
            const list = getEffectiveList();
            if (!list.length) return;
            const idxEff = getCurrentIndexInEffectiveList();
            if (playMode === 'single' && currentPlayingBvid) {
                if (bgmAudio.src) {
                    bgmAudio.currentTime = 0;
                    bgmAudio.play();
                    startVisuals(currentPlayingBvid);
                    updatePlayPauseIcon();
                } else {
                    playMusic(currentPlayingBvid);
                }
                return;
            }
            if (playMode === 'random') {
                const idx = getCurrentIndex();
                const i = getRandomIndex(songList.length, idx);
                playMusic(songList[i].bvid || '');
                return;
            }
            if (playMode === 'favorites') {
                const nextIdx = idxEff < 0 ? 0 : (idxEff + 1) % list.length;
                playMusic(list[nextIdx].bvid || '');
                return;
            }
            const idx = getCurrentIndex();
            const nextIdx = idx < 0 ? 0 : (idx + 1) % songList.length;
            playMusic(songList[nextIdx].bvid || '');
        }

        function updatePlayPauseIcon() {
            if (btnPlayPause) {
                btnPlayPause.classList.toggle('is-playing', !bgmAudio.paused);
                btnPlayPause.title = bgmAudio.paused ? '播放' : '暂停';
            }
            updateDocumentTitle();
        }

        function updatePlaySongName() {
            if (!playSongNameEl) return;
            const idx = getCurrentIndex();
            if (idx >= 0 && songList[idx]) {
                playSongNameEl.textContent = songList[idx].name || songList[idx].title || '—';
            } else {
                playSongNameEl.textContent = currentPlayingBvid ? '…' : '—';
            }
            updateFavButton();
            updateDocumentTitle();
        }

        function updateDocumentTitle() {
            if (currentPlayingBvid && !bgmAudio.paused) {
                const idx = getCurrentIndex();
                const name = (idx >= 0 && songList[idx]) ? (songList[idx].name || songList[idx].title || '—') : '…';
                document.title = name + ' · 思诺';
            } else {
                document.title = DEFAULT_TITLE;
            }
        }

        // 播放函数
        async function playMusic(bvid) {
            if (!bvid) return;
            try {
                const res = await fetch(`${API_BASE}/resolve?bvid=${bvid}`);
                const data = await res.json();
                const realUrl = data.url;

                if (realUrl) {
                    currentPlayingBvid = bvid;
                    const proxyUrl = `${API_BASE}/proxy?url=${encodeURIComponent(realUrl)}`;
                    bgmAudio.src = proxyUrl;
                    bgmAudio.volume = 0.5;
                    updateProgressDisplay();
                    updatePlaySongName();
                    await bgmAudio.play();
                    startVisuals(bvid);
                    updatePlayPauseIcon();
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 视觉效果联动：暂停时保持当前角度，播放时从该角度继续转
        function startVisuals(bvid) {
            const deg = getRecordRotationDeg(characterImg);
            characterImg.style.setProperty('--start-deg', deg + 'deg');
            characterImg.style.removeProperty('transform');
            characterImg.classList.add('is-playing');
        }

        function stopVisuals() {
            const deg = getRecordRotationDeg(characterImg);
            characterImg.classList.remove('is-playing');
            characterImg.style.setProperty('transform', 'rotate(' + deg + 'deg)');
        }

        // 播放条与时间
        bgmAudio.addEventListener('timeupdate', updateProgressDisplay);
        bgmAudio.addEventListener('loadedmetadata', updateProgressDisplay);

        // 拖动进度条跳转
        if (progressBarEl) progressBarEl.addEventListener('input', () => {
            const d = bgmAudio.duration;
            if (isFinite(d) && d > 0) {
                const p = parseFloat(progressBarEl.value) / 100;
                bgmAudio.currentTime = p * d;
                progressBarEl.style.setProperty('--progress', progressBarEl.value + '%');
            }
        });

        // 音频结束
        bgmAudio.addEventListener('ended', () => {
            updateProgressDisplay();
            stopVisuals();
            updatePlayPauseIcon();
            playNextByMode();
        });

        // 播放/暂停按钮
        btnPlayPause.addEventListener('click', () => {
            if (bgmAudio.paused) {
                if (bgmAudio.src) {
                    bgmAudio.play();
                    if (currentPlayingBvid) {
                        const deg = getRecordRotationDeg(characterImg);
                        characterImg.style.setProperty('--start-deg', deg + 'deg');
                        characterImg.style.removeProperty('transform');
                        characterImg.classList.add('is-playing');
                        updatePlaySongName();
                    }
                    updatePlayPauseIcon();
                } else if (songList.length) {
                    playMusic(songList[0].bvid || '');
                }
            } else {
                bgmAudio.pause();
                stopVisuals();
                updatePlayPauseIcon();
            }
        });

        // 模式循环按钮：列表 → 单曲 → 随机 →（有收藏时）播放收藏 → 列表
        function getModeOrder() {
            return favoritesSet.size ? ['list', 'single', 'random', 'favorites'] : ['list', 'single', 'random'];
        }
        if (btnModeCycle) {
            btnModeCycle.addEventListener('click', () => {
                const order = getModeOrder();
                let idx = order.indexOf(playMode);
                if (idx < 0) idx = 0;
                const next = order[(idx + 1) % order.length];
                setPlayMode(next);
            });
        }
        setPlayMode('list');
        updatePlayPauseIcon();

        // 收藏按钮（下一曲与歌单之间）：切换当前曲收藏状态
        const btnFav = document.getElementById('btn-fav');
        function updateFavButton() {
            if (!btnFav) return;
            btnFav.classList.toggle('is-fav', isFavorite(currentPlayingBvid));
            btnFav.title = isFavorite(currentPlayingBvid) ? '取消收藏' : '收藏';
        }
        if (btnFav) {
            btnFav.addEventListener('click', () => {
                if (!currentPlayingBvid) return;
                toggleFavorite(currentPlayingBvid);
                updateFavButton();
                if (playlistFilterBtn) {
                    playlistFilterBtn.classList.toggle('active', playlistFilterFavorites);
                    if (playlistFilterFavorites) renderPlaylist();
                }
            });
        }

        // 上一首 / 下一首
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        function goPrev() {
            const list = getEffectiveList();
            if (!list.length) return;
            const idxEff = getCurrentIndexInEffectiveList();
            if (playMode === 'random') {
                const idx = getCurrentIndex();
                const i = getRandomIndex(songList.length, idx);
                playMusic(songList[i].bvid || '');
            } else {
                const prevIdx = idxEff <= 0 ? list.length - 1 : idxEff - 1;
                playMusic(list[prevIdx].bvid || '');
            }
        }
        function goNext() {
            const list = getEffectiveList();
            if (!list.length) return;
            const idxEff = getCurrentIndexInEffectiveList();
            if (playMode === 'random') {
                const idx = getCurrentIndex();
                const i = getRandomIndex(songList.length, idx);
                playMusic(songList[i].bvid || '');
            } else {
                const nextIdx = idxEff < 0 ? 0 : (idxEff + 1) % list.length;
                playMusic(list[nextIdx].bvid || '');
            }
        }
        if (btnPrev) btnPrev.addEventListener('click', goPrev);
        if (btnNext) btnNext.addEventListener('click', goNext);

        // 点击圆环：暂停 / 继续（播放页）
        characterImg.addEventListener('click', () => {
            if (!bgmAudio.paused) {
                bgmAudio.pause();
                stopVisuals();
            } else if (bgmAudio.src) {
                bgmAudio.play();
                const deg = getRecordRotationDeg(characterImg);
                characterImg.style.setProperty('--start-deg', deg + 'deg');
                characterImg.style.removeProperty('transform');
                characterImg.classList.add('is-playing');
            }
            updatePlayPauseIcon();
        });

    </script>
</body>
</html>
