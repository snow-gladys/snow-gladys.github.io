<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <title>思诺 · Gladys</title>
    <style>
        /* --- 基础设置 --- */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-color: #050505;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* --- 容器与图层 --- */
        #scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 默认不响应鼠标，让点击穿透 */
        }

        /* --- 背景层 --- */
        .bg-grid {
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(26, 26, 46, 0.5) 0%, rgba(0, 0, 0, 1) 100%),
                url('./imgs/bg_texture.png') no-repeat center center/cover;
            z-index: 1;
        }

        /* --- 人物层 --- */
        .character-layer {
            z-index: 5;
        }

        .character-img {
            width: 55vh;
            height: 55vh;
            margin-top: -12vh; /* 在居中基础上上移，为底部留出空间 */
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
            background: url('./imgs/snow_char.png') no-repeat center center/cover;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            pointer-events: auto; /* 允许点击人物 */
        }

        /* 旋转动画 + 中心镂空（在唱片上挖洞，中间真正透明） */
        .character-img.is-playing {
            animation: spin-record 10s linear infinite;
            filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.7));
            /* 中心约 10% 半径挖空，与下方 .center-hole 大小一致 */
            mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 14.3%, black 10%);
        }

        /* 中心孔洞：镂空（透明）+ 蓝色描边，不挡文字层 */
        .center-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20%;
            height: 20%;
            transform: translate(-50%, -50%) scale(0);
            background: transparent; /* 镂空，中心不涂黑，文字层可透出 */
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            overflow: hidden;
            z-index: 5;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px var(--neon-blue);
            pointer-events: none;
        }

        /* 播放时显示孔洞 */
        .character-img.is-playing .center-hole {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* 视频 iframe */
        #bili-player {
            width: 300%;
            height: 300%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        
        /* --- UI 文字层 --- */
        .ui-layer {
            z-index: 100;
            text-align: center;
            mix-blend-mode: overlay;
            isolation: isolate;
            pointer-events: none;
        }

        .glitch-title {
            position: relative;
            z-index: 1;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 10px;
            color: white;
            text-shadow: 2px 2px var(--neon-purple);
        }

        .subtitle {
            position: relative;
            z-index: 1;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-top: -20px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        /* --- 关注按钮（左上角，与右侧粉丝数对称）--- */
        .cta-container {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 220px;
            z-index: 110;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-blue);
            border-left: 5px solid var(--neon-blue);
            padding: 5px;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .cta-btn {
            display: block;
            padding: 12px 0;
            font-size: 1.4rem;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: bold;
            color: var(--neon-blue);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: transparent;
            border: none;
            transition: all 0.3s;
        }

        .cta-btn:hover {
            color: #000;
            background: var(--neon-blue);
            margin: 0 -15px;
            padding-left: 15px;
            padding-right: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        @keyframes spin-record {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- 统计面板 --- */
        .stats-panel {
            position: absolute; top: 5%; right: 5%; width: 160px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-blue);
            padding: 10px 12px; text-align: right; border-right: 4px solid var(--neon-blue);
            pointer-events: auto; backdrop-filter: blur(5px); z-index: 110;
        }

        .stats-panel .stats-label {
            font-size: 0.7rem; color: #aaa; display: block;
        }
        .stats-number {
            font-family: 'Courier New', monospace; font-size: 1.85rem;
            font-weight: bold; color: var(--neon-blue);
        }

        /* --- 播放控制栏：唱片与歌单之间 --- */
        .player-controls {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 420px;
            z-index: 95;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            border-left-width: 5px;
            backdrop-filter: blur(5px);
        }

        .player-controls .btn-play-pause {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            background: rgba(0, 243, 255, 0.08);
            color: var(--neon-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .player-controls .btn-play-pause:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .player-controls .mode-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-controls .btn-mode {
            padding: 8px 14px;
            font-size: 0.8rem;
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid var(--neon-blue);
            background: transparent;
            color: var(--neon-blue);
            cursor: pointer;
            transition: all 0.25s;
            opacity: 0.6;
        }
        .player-controls .btn-mode:hover {
            opacity: 1;
        }
        .player-controls .btn-mode.active {
            background: rgba(0, 243, 255, 0.2);
            opacity: 1;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }

        /* 播放条与时间 */
        .player-controls {
            flex-direction: column;
            gap: 10px;
        }
        .player-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .player-progress-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-progress-wrap .time {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            min-width: 2.8em;
            text-align: center;
        }
        .player-progress-wrap .time-total {
            color: rgba(0, 243, 255, 0.7);
        }
        .player-progress-wrap .progress-bar {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 243, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }
        .player-progress-wrap .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-blue);
            transition: transform 0.15s;
        }
        .player-progress-wrap .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        .player-progress-wrap .progress-bar::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        .player-progress-wrap .progress-bar::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--neon-blue) 0%, var(--neon-blue) var(--progress, 0%), transparent var(--progress, 0%));
        }
        .player-progress-wrap .progress-bar::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: rgba(0, 243, 255, 0.15);
        }
        .player-progress-wrap .progress-bar::-moz-range-progress {
            height: 6px;
            border-radius: 3px;
            background: var(--neon-blue);
        }

        /* --- 底部滚动歌名：80% 宽，位于底部留白处 --- */
        .song-ticker-wrap {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 48px;
            z-index: 90;
            pointer-events: auto;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--neon-blue);
            border-right: 1px solid var(--neon-blue);
            border-bottom: 1px solid var(--neon-blue);
            border-left: 5px solid var(--neon-blue);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
        }

        .song-ticker-label {
            flex-shrink: 0;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-transform: uppercase;
            padding: 0 20px;
            border-right: 1px solid rgba(0, 243, 255, 0.4);
            margin-right: 12px;
        }

        .song-ticker-track {
            flex: 1;
            overflow: hidden;
            min-width: 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 避免触摸拖动时整页滚动 */
        }

        .song-ticker-track.dragging {
            cursor: grabbing;
        }

        .song-ticker-inner {
            display: inline-flex;
            align-items: center;
            gap: 0;
            white-space: nowrap;
            will-change: transform;
        }

        .song-ticker-inner .song-item {
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            padding: 0 24px;
            cursor: pointer;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .song-ticker-inner .song-item:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .song-ticker-inner .song-item.current {
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-blue);
        }

        .song-ticker-inner .song-sep {
            color: var(--neon-blue);
            opacity: 0.6;
            font-size: 0.9rem;
            padding: 0 8px;
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            .glitch-title { font-size: 3rem; }
            .character-img { width: 42vh; height: 42vh; margin-top: -8vh; }
            .cta-container { display: none; }
            .player-controls {
                bottom: 16%; width: 90%; max-width: none; padding: 10px 14px; gap: 8px;
                border-top: 1px solid var(--neon-blue);
                border-right: 1px solid var(--neon-blue);
                border-bottom: 1px solid var(--neon-blue);
                border-left: 5px solid var(--neon-blue);
            }
            .player-controls .btn-play-pause { width: 42px; height: 42px; font-size: 1.25rem; }
            .player-controls .btn-mode { padding: 6px 10px; font-size: 0.7rem; }
            .player-progress-wrap .time { font-size: 0.7rem; }
            .player-progress-wrap .progress-bar { height: 5px; }
            .player-progress-wrap .progress-bar::-webkit-slider-thumb { width: 12px; height: 12px; }
            .player-progress-wrap .progress-bar::-moz-range-thumb { width: 12px; height: 12px; }
            .song-ticker-wrap { width: 90%; bottom: 8%; height: 40px; }
            .song-ticker-label { padding: 0 12px; font-size: 0.65rem; }
            .song-ticker-inner .song-item { font-size: 1rem; padding: 0 16px; }
        }

    </style>
</head>

    <script>
        // --- 0. 配置中心 ---
        // 如果你绑定了 api.snow-gladys.com，请使用下面第一行
        const API_BASE = 'https://api.snow-gladys.com'; 
        // 如果没绑定成功，暂时用 Worker 原生地址：
        // const API_BASE = 'https://snow-api-proxy.pengyiteng0827.workers.dev'; 

        // --- 1. 获取粉丝数逻辑 ---
        const fanCountElement = document.getElementById('fan-count');
        
        async function fetchFanCount() {
            try {
                // 注意：这里请求的是 /fans 路径
                const response = await fetch(`${API_BASE}/fans`);
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                if (data.code === 0) {
                    fanCountElement.innerText = data.data.follower.toLocaleString();
                }
            } catch (error) {
                console.error("粉丝数获取失败:", error);
                fanCountElement.innerText = '---';
            }
        }
        fetchFanCount(); // 立即运行一次

        // --- 1.5 歌单与底部滚动歌名（支持拖动/滑动）---
        let songList = [];
        const tickerInner = document.getElementById('song-ticker-inner');
        const tickerTrack = document.querySelector('.song-ticker-track');

        let tickerScrollOffset = 0;
        let tickerHalfWidth = 0;
        let tickerDragging = false;
        let tickerDidDrag = false;
        let tickerStartX = 0;
        let tickerStartOffset = 0;
        let tickerLastTime = 0;
        const TICKER_SPEED = 28; // 像素/秒

        function tickerApplyTransform() {
            tickerInner.style.transform = `translateX(${-tickerScrollOffset}px)`;
        }

        function tickerLoop(now) {
            requestAnimationFrame(tickerLoop);
            const dt = tickerLastTime ? (now - tickerLastTime) / 1000 : 0;
            tickerLastTime = now;
            if (!tickerDragging && tickerHalfWidth > 0) {
                tickerScrollOffset += TICKER_SPEED * dt;
                while (tickerScrollOffset >= tickerHalfWidth) tickerScrollOffset -= tickerHalfWidth;
                while (tickerScrollOffset < 0) tickerScrollOffset += tickerHalfWidth;
            }
            tickerApplyTransform();
        }
        requestAnimationFrame(tickerLoop);

        function tickerOnPointerDown(e) {
            if (e.target.closest('.song-item')) return; // 点击歌名不当作拖拽起点
            tickerDragging = true;
            tickerDidDrag = false;
            tickerStartX = e.clientX;
            tickerStartOffset = tickerScrollOffset;
            tickerTrack.classList.add('dragging');
            tickerTrack.setPointerCapture(e.pointerId);
        }

        function tickerOnPointerMove(e) {
            if (!tickerDragging || tickerHalfWidth <= 0) return;
            e.preventDefault(); // 避免触摸时整页滑动
            const dx = tickerStartX - e.clientX;
            if (Math.abs(dx) > 5) tickerDidDrag = true;
            let next = tickerStartOffset + dx;
            while (next < 0) next += tickerHalfWidth;
            while (next >= tickerHalfWidth) next -= tickerHalfWidth;
            tickerScrollOffset = next;
            tickerApplyTransform();
        }

        function tickerOnPointerUp(e) {
            tickerDragging = false;
            tickerTrack.classList.remove('dragging');
            tickerTrack.releasePointerCapture(e.pointerId);
        }

        if (tickerTrack) {
            tickerTrack.addEventListener('pointerdown', tickerOnPointerDown);
            tickerTrack.addEventListener('pointermove', tickerOnPointerMove);
            tickerTrack.addEventListener('pointerup', tickerOnPointerUp);
            tickerTrack.addEventListener('pointercancel', tickerOnPointerUp);
        }

  },
  {
    "name": "起风了",
    "bvid": "BV1WvK2zqEBo"
  },
  {
    "name": "爱的天灵灵",
    "bvid": "BV1TPgPzYE4S"
  },
  {
    "name": "逆光",
    "bvid": "BV1fv61B4Evn"
  }
];
            try {
                const res = await fetch('./songs.json');
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    songList = data;
                } else {
                    songList = fallbackList;
                }
                renderTicker();
            } catch (e) {
                console.warn('歌单加载失败，使用默认列表:', e);
                songList = fallbackList;
                renderTicker();
            }
        }

        function renderTicker(currentBvid) {
            const labelEl = document.getElementById('song-ticker-label');
            if (labelEl) labelEl.textContent = `♪ ${songList.length}首`;
            if (!songList.length) return;
            currentBvid = (currentBvid || '').trim().toUpperCase();
            const sep = '<span class="song-sep">◆</span>';
            const items = songList.map(s => {
                const isCurrent = (s.bvid || '').toUpperCase() === currentBvid;
                return `<span class="song-item${isCurrent ? ' current' : ''}" data-bvid="${(s.bvid || '').replace(/"/g, '&quot;')}">${escapeHtml(s.name || s.title || '')}</span>`;
            }).join(sep);
            // 双份拼接实现无缝循环滚动
            tickerInner.innerHTML = items + sep + items;
            if (tickerInner.scrollWidth > 0) tickerHalfWidth = tickerInner.scrollWidth / 2;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function setCurrentSongByBvid(bvid) {
            renderTicker(bvid);
        }

        loadSongs();

        // --- 2. 纯音乐播放逻辑 (核心) ---
        const bgmAudio = new Audio();
        bgmAudio.crossOrigin = "anonymous"; // 允许跨域
        
        const characterImg = document.querySelector('.character-img');
        let currentPlayingBvid = '';  // 当前播放的 bvid
        let playMode = 'list';        // 'list' | 'single' | 'random'

        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnModeList = document.getElementById('btn-mode-list');
        const btnModeSingle = document.getElementById('btn-mode-single');
        const btnModeRandom = document.getElementById('btn-mode-random');
        const timeCurrentEl = document.getElementById('time-current');
        const timeTotalEl = document.getElementById('time-total');
        const progressBarEl = document.getElementById('progress-bar');

        function formatTime(sec) {
            if (sec === undefined || sec === null || !isFinite(sec) || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateProgressDisplay() {
            const t = bgmAudio.currentTime;
            const d = bgmAudio.duration;
            timeCurrentEl.textContent = formatTime(t);
            if (isFinite(d) && d > 0) {
                timeTotalEl.textContent = formatTime(d);
                const p = (t / d) * 100;
                progressBarEl.value = p;
                progressBarEl.style.setProperty('--progress', p + '%');
            } else {
                timeTotalEl.textContent = '0:00';
                progressBarEl.value = 0;
                progressBarEl.style.setProperty('--progress', '0%');
            }
        }

        function setPlayMode(mode) {
            playMode = mode;
            btnModeList.classList.toggle('active', mode === 'list');
            btnModeSingle.classList.toggle('active', mode === 'single');
            btnModeRandom.classList.toggle('active', mode === 'random');
        }

        function getCurrentIndex() {
            if (!currentPlayingBvid || !songList.length) return -1;
            const u = currentPlayingBvid.toUpperCase();
            return songList.findIndex(s => (s.bvid || '').toUpperCase() === u);
        }

        function playNextByMode() {
            if (!songList.length) return;
            const idx = getCurrentIndex();
            // 单曲循环：不重复请求 API，直接从头播当前已加载的音频
            if (playMode === 'single' && currentPlayingBvid) {
                if (bgmAudio.src) {
                    bgmAudio.currentTime = 0;
                    bgmAudio.play();
                    startVisuals(currentPlayingBvid);
                    updatePlayPauseIcon();
                } else {
                    playMusic(currentPlayingBvid);
                }
                return;
            }
            if (playMode === 'random') {
                const i = Math.floor(Math.random() * songList.length);
                playMusic(songList[i].bvid || '');
                return;
            }
            // list
            const nextIdx = idx < 0 ? 0 : (idx + 1) % songList.length;
            playMusic(songList[nextIdx].bvid || '');
        }

        function updatePlayPauseIcon() {
            btnPlayPause.textContent = bgmAudio.paused ? '▶' : '❚❚';
            btnPlayPause.title = bgmAudio.paused ? '播放' : '暂停';
        }

        // 播放函数
        async function playMusic(bvid) {
            if (!bvid) return;
            try {
                const res = await fetch(`${API_BASE}/resolve?bvid=${bvid}`);
                const data = await res.json();
                const realUrl = data.url;

                if (realUrl) {
                    currentPlayingBvid = bvid;
                    const proxyUrl = `${API_BASE}/proxy?url=${encodeURIComponent(realUrl)}`;
                    bgmAudio.src = proxyUrl;
                    bgmAudio.volume = 0.5;
                    updateProgressDisplay(); // 重置进度条与时间
                    await bgmAudio.play();
                    setCurrentSongByBvid(bvid);
                    startVisuals(bvid);
                    updatePlayPauseIcon();
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 视觉效果联动
        function startVisuals(bvid) {
            // 让圆环转起来
            characterImg.classList.add('is-playing');
            
            // 在中间孔洞显示视频画面 (静音)
            // 这样既有声音(Audio标签) 又有画面(iframe)
            // videoFrame.src = `https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&muted=1`; 
        }

        function stopVisuals() {
            characterImg.classList.remove('is-playing');
            // videoFrame.src = ""; // 停止视频
        }

        // 播放条与时间：随播放更新
        bgmAudio.addEventListener('timeupdate', updateProgressDisplay);
        bgmAudio.addEventListener('loadedmetadata', updateProgressDisplay);
        bgmAudio.addEventListener('ended', () => {
            updateProgressDisplay();
        });

        // 拖动进度条跳转
        progressBarEl.addEventListener('input', () => {
            const d = bgmAudio.duration;
            if (isFinite(d) && d > 0) {
                const p = parseFloat(progressBarEl.value) / 100;
                bgmAudio.currentTime = p * d;
                progressBarEl.style.setProperty('--progress', progressBarEl.value + '%');
            }
        });

        // 音频结束：按模式播下一首 / 单曲循环 / 随机
        bgmAudio.addEventListener('ended', () => {
            stopVisuals();
            updatePlayPauseIcon();
            playNextByMode();
        });

        // 播放/暂停按钮
        btnPlayPause.addEventListener('click', () => {
            if (bgmAudio.paused) {
                if (bgmAudio.src) {
                    bgmAudio.play();
                    if (currentPlayingBvid) {
                        characterImg.classList.add('is-playing');
                        setCurrentSongByBvid(currentPlayingBvid);
                    }
                    updatePlayPauseIcon();
                } else if (songList.length) {
                    playMusic(songList[0].bvid || '');
                }
            } else {
                bgmAudio.pause();
                stopVisuals();
                updatePlayPauseIcon();
            }
        });

        // 模式按钮：列表 / 单曲 / 随机
        btnModeList.addEventListener('click', () => setPlayMode('list'));
        btnModeSingle.addEventListener('click', () => setPlayMode('single'));
        btnModeRandom.addEventListener('click', () => setPlayMode('random'));
        setPlayMode('list'); // 默认列表循环
        updatePlayPauseIcon();

        // 点击歌名：播放该曲（拖动后不触发播放）
        document.getElementById('song-ticker-wrap').addEventListener('click', (e) => {
            if (tickerDidDrag) { tickerDidDrag = false; e.preventDefault(); return; }
            const item = e.target.closest('.song-item');
            if (item && item.dataset.bvid) {
                playMusic(item.dataset.bvid.trim());
            }
        });

        // 点击圆环：暂停 / 继续
        characterImg.addEventListener('click', () => {
            if (!bgmAudio.paused) {
                bgmAudio.pause();
                stopVisuals();
            } else if (bgmAudio.src) {
                bgmAudio.play();
                characterImg.classList.add('is-playing');
            }
            updatePlayPauseIcon();
        });

    </script>
</body>
</html>
