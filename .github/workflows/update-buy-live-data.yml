name: Update buy live data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Weidian item data
        run: node scripts/update-buy-live-data.mjs

      - name: Commit live data changes
        run: |
          if git diff --quiet buy/data/live-items.json; then
            echo "No live data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buy/data/live-items.json
          git commit -m "Update buy live data"
          git push
