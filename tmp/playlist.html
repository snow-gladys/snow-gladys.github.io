<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>思诺 · Gladys (歌单终极优化版)</title>
    <style>
        :root {
            --bg-light: #FAFAFC; 
            --text-main: #111111; 
            --text-sub: #86868B;
            --neon-blue: #00f3ff;
            --neon-blue-soft: rgba(0, 243, 255, 0.08);
            --border-light: 1px solid rgba(0, 0, 0, 0.05);
        }

        body, html {
            margin: 0; padding: 0; background: #EEE; /* 模拟背景遮罩 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* --- 歌单面板 --- */
        .playlist-panel {
            width: 400px; height: 75vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 24px; display: flex; flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            position: relative; overflow: hidden;
        }

        /* --- 头部：含关闭按钮与搜索 --- */
        .playlist-header {
            padding: 24px 24px 12px;
            position: relative;
        }
        
        /* 找回右上角关闭按钮 */
        .btn-close-top {
            position: absolute; top: 20px; right: 20px;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(0,0,0,0.05); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-sub); transition: 0.2s;
        }
        .btn-close-top:hover { background: rgba(0,0,0,0.1); color: var(--text-main); }

        .playlist-title { font-size: 1.15rem; font-weight: 800; margin: 0 0 16px 0; }

        .search-box {
            position: relative; width: 100%;
        }
        .search-input {
            width: 100%; box-sizing: border-box; /* 彻底防止溢出 */
            background: rgba(0,0,0,0.04); border: none; border-radius: 12px;
            padding: 10px 14px 10px 36px; font-size: 0.9rem; outline: none;
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); width: 16px; }

        /* --- 列表区域 --- */
        .playlist-content { display: flex; flex: 1; min-height: 0; }

        .playlist-list {
            flex: 1; overflow-y: auto; padding: 10px 0; scrollbar-width: none;
        }
        .playlist-list::-webkit-scrollbar { display: none; }

        .playlist-item {
            padding: 12px 24px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; transition: 0.2s;
            border-left: 3px solid transparent;
        }
        .playlist-item:hover { background: rgba(0,0,0,0.02); }
        .playlist-item.is-current {
            background: var(--neon-blue-soft); border-left-color: var(--neon-blue);
        }

        .item-info { 
            display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; 
        }
        .song-name { 
            font-size: 0.95rem; font-weight: 700; color: var(--text-main); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 互斥图标：Live 或 User */
        .live-tag {
            font-size: 0.55rem; font-weight: 800; color: var(--neon-blue);
            border: 1px solid var(--neon-blue); padding: 0px 4px; border-radius: 3px;
            flex-shrink: 0; background: rgba(0, 243, 255, 0.05);
        }
        .user-icon { width: 12px; height: 12px; color: var(--text-sub); opacity: 0.5; flex-shrink: 0; }

        .item-right { display: flex; align-items: center; gap: 12px; }
        .fav-heart { color: var(--text-sub); opacity: 0.2; }
        .playlist-item:hover .fav-heart { opacity: 0.6; }
        .fav-heart.active { color: var(--neon-blue); opacity: 1; }

        /* --- 右侧 A-Z 导航 --- */
        .alpha-nav {
            width: 26px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-left: var(--border-light); padding: 10px 0;
        }
        .alpha-key {
            font-size: 0.6rem; font-weight: 800; color: #D2D2D7;
            height: 18px; display: flex; align-items: center;
        }
        .alpha-key.active { color: var(--neon-blue); cursor: pointer; }
    </style>
</head>
<body>

    <div class="playlist-panel">
        <button class="btn-close-top">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>

        <div class="playlist-header">
            <h3 class="playlist-title">全部歌曲</h3>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" class="search-input" placeholder="快速查找...">
            </div>
        </div>

        <div class="playlist-content">
            <div class="playlist-list">
                <div class="playlist-item is-current">
                    <div class="item-info">
                        <span class="song-name">孤独北半球</span>
                        <span class="live-tag">LIVE</span>
                    </div>
                    <div class="item-right">
                        <svg class="fav-heart active" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                </div>

                <div class="playlist-item">
                    <div class="item-info">
                        <span class="song-name">重返枝江</span>
                        <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <div class="item-right">
                        <svg class="fav-heart" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                </div>
            </div>

            <div class="alpha-nav">
                <div class="alpha-key active">A</div>
                <div class="alpha-key">B</div>
                <div class="alpha-key active">G</div>
                <div class="alpha-key">L</div>
                <div class="alpha-key active">Z</div>
                <div class="alpha-key">#</div>
            </div>
        </div>
    </div>

</body>
</html>
