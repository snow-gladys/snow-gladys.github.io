<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    width: 400px; background: #fff; color: #222;
  }

  .header {
    background: #c62f2f; color: #fff;
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  }
  .header h1 { font-size: 1rem; font-weight: 600; }
  .header .song-id { font-size: 0.78rem; opacity: 0.85; margin-left: auto; }

  .toolbar {
    display: flex; gap: 6px; padding: 10px 12px;
    border-bottom: 1px solid #eee; align-items: center;
    flex-wrap: wrap;
  }
  .song-name {
    font-size: 0.85rem; color: #555; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button {
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.8rem; padding: 5px 12px; transition: background 0.15s;
  }
  .btn-clear { background: #f0f0f0; color: #444; }
  .btn-clear:hover { background: #e0e0e0; }
  .btn-copy { background: #1a73e8; color: #fff; }
  .btn-copy:hover { background: #1558b0; }
  .btn-save { background: #2e7d32; color: #fff; }
  .btn-save:hover { background: #1b5e20; }
  button:disabled { background: #ccc !important; color: #999 !important; cursor: not-allowed; }

  .status {
    padding: 10px 14px; font-size: 0.85rem; color: #888;
    min-height: 38px; display: flex; align-items: center;
  }
  .status.error { color: #c62f2f; }
  .status.ok { color: #2e7d32; }

  textarea {
    width: 100%; height: 300px; border: none; border-top: 1px solid #eee;
    padding: 12px 14px; font-family: 'Menlo', 'Consolas', monospace;
    font-size: 0.82rem; line-height: 1.7; resize: none; outline: none;
    background: #fafafa; color: #222;
  }

  .save-row {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid #eee; align-items: center;
  }
  .save-row input {
    flex: 1; border: 1.5px solid #ddd; border-radius: 6px;
    padding: 5px 10px; font-size: 0.82rem; outline: none;
  }
  .save-row input:focus { border-color: #1a73e8; }

  .not-song {
    padding: 30px 20px; text-align: center; color: #888; font-size: 0.9rem;
    line-height: 1.8;
  }
  .not-song a { color: #c62f2f; text-decoration: none; }
  .not-song a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <h1>🎵 歌词提取</h1>
  <span class="song-id" id="song-id-label"></span>
</div>

<div id="main-ui" style="display:none">
  <div class="toolbar">
    <span class="song-name" id="song-name">—</span>
    <button class="btn-clear" id="btn-clear-empty">去除空行</button>
    <button class="btn-copy" id="btn-copy">复制</button>
  </div>
  <div class="status" id="status">正在获取歌词…</div>
  <textarea id="lyric-output" spellcheck="false" placeholder="歌词将显示在此处…"></textarea>
  <div class="save-row">
    <input type="text" id="filename" placeholder="文件名（不含 .lrc）" />
    <button class="btn-save" id="btn-save">保存 .lrc</button>
  </div>
</div>

<div class="not-song" id="not-song" style="display:none">
  请在网易云音乐歌曲页面使用本插件。<br><br>
  支持的页面格式：<br>
  <a href="https://music.163.com/song?id=xxxxx" target="_blank">music.163.com/song?id=xxxxx</a>
</div>

<script src="popup.js"></script>
</body>
</html>
