                    <!-- <iframe id="bili-video-frame" 
                        src="" 
                        scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true">
                    </iframe> -->
                </div>
            </div>
        </div>

        <a class="nav-emoji-link" href="./fiona/" title="去心宜">🦭</a>

        <!-- 主页面：图片、文字、粉丝数、两个按钮 -->
        <div class="view-home" id="view-home">
            <div class="layer ui-layer">
                <h1 class="glitch-title">思诺 Gladys</h1>
                <p class="subtitle">Z.J. ENTERTAINMENT</p>
            </div>
            <div class="home-top-right">
                <div class="stats-panel">
                    <span class="stats-label">BILIBILI FOLLOWERS</span>
                    <span class="stats-number" id="fan-count">loading...</span>
                </div>
                <div class="settings-btn-wrap">
                    <button type="button" class="btn-settings" id="btn-settings-home" title="设置" aria-label="设置"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
                </div>
            </div>
            <div class="home-buttons">
                <button type="button" class="home-btn" id="btn-open-playlist">查看歌单</button>
                <button type="button" class="home-btn" id="btn-play-random">随机一首</button>
                <button type="button" class="home-btn home-btn-fav" id="btn-play-favorites" style="display: none;">播放收藏</button>
            </div>
        </div>

        <!-- 歌单页（半透明 90%） -->
        <div class="view-playlist" id="view-playlist">
            <div class="playlist-backdrop" id="playlist-backdrop"></div>
            <div class="playlist-panel">
                <div class="playlist-header">♪ 歌单 · <span id="playlist-count">0</span> 首<button type="button" class="panel-close-btn" id="btn-close-playlist" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                <div class="playlist-search-wrap">
                    <input type="text" class="playlist-search" id="playlist-search" placeholder="搜索歌曲" autocomplete="off">
                    <button type="button" class="playlist-filter-btn" id="playlist-filter-btn" title="只看收藏">
                        <svg class="icon-svg icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        <svg class="icon-svg icon-star-filled" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </button>
                </div>
                <div class="playlist-list" id="playlist-list"></div>
            </div>
        </div>

        <!-- 播放页：进度条、歌名、唱片、五键 -->
        <div class="view-play" id="view-play">
                        <div class="btn-settings-wrap">
                <button type="button" class="btn-settings" id="btn-settings-play" title="设置" aria-label="设置"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
                <button type="button" class="btn-pip-float" id="btn-pip" title="打开小窗播放" aria-label="小窗播放" style="display:none;">
                    <svg class="icon-svg icon-pip-open" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3C1.9 3 1 3.88 1 4.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
                    <svg class="icon-svg icon-pip-close" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3H3C1.9 3 1 3.88 1 4.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V4.98C23 3.88 22.1 3 21 3zm-2 14h-6v-4h6v4zm2-1.02H3V4.97h18v11.01z"/></svg>
                </button>
            </div>
            <!-- 歌词视图：歌词模式时展示滚动歌词（歌名上移至 btn-settings-wrap 行） -->
            <div class="lyrics-view" id="lyrics-view">
                <div class="lyrics-scroll" id="lyrics-scroll"></div>
            </div>
            <div class="play-song-name" id="play-song-name">—</div>
            <!-- 歌名与进度条之间的单行歌词提示 -->
            <div class="play-current-lyric" id="play-current-lyric"></div>
            <div class="play-progress-wrap">
                <span class="time" id="time-current">0:00</span>
                <input type="range" class="progress-bar" id="progress-bar" min="0" max="100" value="0" step="0.1">
                <span class="time time-total" id="time-total">0:00</span>
            </div>
            <div class="play-controls">
                <!-- 歌词按钮（在模式按钮左边） -->
                <button type="button" class="btn-icon btn-lyrics" id="btn-lyrics" title="歌词" aria-label="歌词">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="15" y2="14"/><line x1="3" y1="18" x2="19" y2="18"/></svg>
                </button>
                <button type="button" class="btn-mode-cycle is-mode-list" id="btn-mode-cycle" title="列表循环" aria-label="播放模式">
                    <svg class="icon-mode icon-mode-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C16.6944 20.5 20.5 16.6945 20.5 12C20.5 9.17456 19.1213 6.67103 17 5.1255M13 22.4L11 20.4L13 18.4M12 3.5C7.30558 3.5 3.5 7.30568 3.5 12C3.5 14.8256 4.87867 17.3292 7 18.8747M11 5.6L13 3.6L11 1.6"/></svg>
                    <svg class="icon-mode icon-mode-single" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C16.6944 20.5 20.5 16.6945 20.5 12C20.5 9.17456 19.1213 6.67103 17 5.1255M13 22.4L11 20.4L13 18.4M12 3.5C7.30558 3.5 3.5 7.30568 3.5 12C3.5 14.8256 4.87867 17.3292 7 18.8747M11 5.6L13 3.6L11 1.6"/><path d="M10.7 9.3L12.1 7.7L12 8v7.2"/></svg>
                    <svg class="icon-mode icon-mode-random" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.7 14.2C8 14.7 7.1 15 6.2 15H4c-0.6 0-1 0.4-1 1s0.4 1 1 1h2.2c1.3 0 2.6-0.4 3.7-1.2c0.4-0.3 0.5-1 0.2-1.4C9.7 13.9 9.1 13.8 8.7 14.2z"/><path d="M13 10.7c0.3 0 0.6-0.1 0.8-0.3C14.5 9.5 15.6 9 16.8 9h0.8l-0.3 0.3c-0.4 0.4-0.4 1 0 1.4c0.2 0.2 0.5 0.3 0.7 0.3s0.5-0.1 0.7-0.3l2-2c0.1-0.1 0.2-0.2 0.2-0.3c0.1-0.2 0.1-0.5 0-0.8c-0.1-0.1-0.1-0.2-0.2-0.3l-2-2c-0.4-0.4-1-0.4-1.4 0s-0.4 1 0 1.4L17.6 7h-0.8c-1.8 0-3.4 0.8-4.6 2.1c-0.4 0.4-0.3 1 0.1 1.4C12.5 10.7 12.8 10.7 13 10.7z"/><path d="M20.7 15.3l-2-2c-0.4-0.4-1-0.4-1.4 0s-0.4 1 0 1.4l0.3 0.3h-1.5c-1.6 0-2.9-0.9-3.6-2.3l-1.2-2.4C10.3 8.3 8.2 7 5.9 7H4C3.4 7 3 7.4 3 8s0.4 1 1 1h1.9c1.6 0 2.9 0.9 3.6 2.3l1.2 2.4c1 2.1 3.1 3.4 5.4 3.4h1.5l-0.3 0.3c-0.4 0.4-0.4 1 0 1.4c0.2 0.2 0.5 0.3 0.7 0.3s0.5-0.1 0.7-0.3l2-2C21.1 16.3 21.1 15.7 20.7 15.3z"/></svg>
                    <svg class="icon-mode icon-mode-favorites" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C16.6944 20.5 20.5 16.6945 20.5 12C20.5 9.17456 19.1213 6.67103 17 5.1255M13 22.4L11 20.4L13 18.4M12 3.5C7.30558 3.5 3.5 7.30568 3.5 12C3.5 14.8256 4.87867 17.3292 7 18.8747M11 5.6L13 3.6L11 1.6"/><g transform="translate(12,12) scale(0.45) translate(-12,-12)"><path fill="currentColor" stroke="none" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></g></svg>
                </button>
                <button type="button" class="btn-icon" id="btn-prev" title="上一首">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6V6zm4.5 6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button type="button" class="btn-icon btn-play" id="btn-play-pause" title="播放/暂停">
                    <svg class="icon-svg icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
                    <svg class="icon-svg icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button type="button" class="btn-icon" id="btn-next" title="下一首">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2V6zM5 6v12l8.5-6-8.5-6z"/></svg>
                </button>
                <button type="button" class="btn-icon btn-fav" id="btn-fav" title="收藏">
                    <svg class="icon-svg icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <svg class="icon-svg icon-star-filled" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                </button>
                <button type="button" class="btn-icon" id="btn-open-catalog" title="目录">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
        </div>

        <!-- 歌词弹层（添加/编辑用户自定义歌词） -->
        <div class="lyric-form-backdrop" id="lyric-form-backdrop">
            <div class="lyric-form-box" id="lyric-form-box">
                <h4 id="lyric-form-title">添加歌词</h4>
                <div class="lyric-form-hint-row">
                    <span class="lyric-form-hint">粘贴或导入 LRC 格式歌词</span>
                    <button type="button" class="btn-import-lrc" id="lyric-form-import-btn" title="从文件导入">导入文件</button>
                    <input type="file" id="lyric-form-file-input" accept=".lrc,.txt" style="display:none;">
                </div>
                <textarea id="lyric-form-textarea" placeholder="[00:00.00] 第一行歌词&#10;[00:05.00] 第二行歌词" autocomplete="off" spellcheck="false"></textarea>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="lyric-form-cancel">取消</button>
                    <button type="button" class="btn-submit" id="lyric-form-submit">保存</button>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="settings-modal-backdrop" id="settings-modal-backdrop">
            <div class="settings-modal" id="settings-modal">
                <div class="settings-modal-header">设置<button type="button" class="panel-close-btn" id="btn-close-settings" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                <div class="settings-modal-body">
                    <!-- 1. 歌单选择 -->
                    <div class="settings-section settings-section-playlists">
                        <div class="settings-row">
                            <label>显示精选歌单</label>
                            <button type="button" class="settings-toggle is-on" id="toggle-show-main" aria-label="显示精选歌单"></button>
                        </div>
                        <div class="settings-row">
                            <label>显示Live歌单</label>
                            <button type="button" class="settings-toggle" id="toggle-show-live" aria-label="显示Live歌单"></button>
                        </div>
                        <div class="settings-row">
                            <label>显示自定义歌单</label>
                            <button type="button" class="settings-toggle" id="toggle-show-custom" aria-label="显示自定义歌单"></button>
                        </div>
                    </div>

                    <!-- 2. 定时关闭 -->
                    <div class="settings-section settings-section-sleep">
                        <div class="settings-row">
                            <label id="sleep-timer-label">定时关闭</label>
                            <button type="button" class="btn-sleep-open" id="btn-open-sleep-timer">设定时间</button>
                        </div>
                    </div>

                    <!-- 3. 自定义歌曲 -->
                    <div class="settings-section" id="settings-custom-section">
                        <div id="custom-section-buttons">
                            <button type="button" class="btn-add-custom" id="btn-add-custom">添加自定义歌曲</button>
                        </div>
                    </div>

                    <!-- 4. 存储占用 -->
                    <div class="settings-section settings-section-storage">
                        <div class="settings-section-title">存储占用</div>
                        <span class="settings-storage-value" id="storage-usage-display">计算中…</span>
                    </div>

                    <!-- 5. 音质选择 -->
                    <div class="settings-section settings-section-quality">
                        <div class="settings-section-title">音质选择</div>
                        <div class="settings-quality-row">
                            <button type="button" class="btn-quality" data-mode="low">流畅优先</button>
                            <button type="button" class="btn-quality" data-mode="medium">平衡模式</button>
                            <button type="button" class="btn-quality" data-mode="high">音质优先</button>
                        </div>
                    </div>

                    <!-- 5. 媒体会话 & 小窗播放 -->
                    <div class="settings-section settings-section-mediasession">
                        <div class="settings-section-row2">
                            <div class="settings-section-col">
                                <div class="settings-section-title">媒体会话</div>
                                <div class="settings-quality-row">
                                    <button type="button" class="btn-mediasession" data-mode="on">使用</button>
                                    <button type="button" class="btn-mediasession" data-mode="off">不使用</button>
                                </div>
                            </div>
                            <div class="settings-section-col">
                                <div class="settings-section-title">小窗播放 <span class="settings-hint">移动端不完全支持</span></div>
                                <div class="settings-quality-row">
                                    <button type="button" class="btn-pip-setting" data-mode="on">打开</button>
                                    <button type="button" class="btn-pip-setting" data-mode="off">不打开</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 6. 联系方式 与 更新日志 -->
                    <div class="settings-section settings-section-about">
                        <div class="settings-row settings-row-contact">
                            <label>联系方式</label>
                            <span class="settings-contact-text">snowgladys@163.com</span>
                        </div>
                        <div class="settings-row settings-row-changelog">
                            <button type="button" class="btn-changelog" id="btn-changelog">更新日志</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 管理自定义歌曲 弹层（类歌单：搜索 + 列表 + 修改/删除） -->
        <div class="custom-manage-backdrop" id="custom-manage-backdrop">
            <div class="custom-manage-panel" id="custom-manage-panel">
                <div class="custom-manage-header">管理自定义歌曲</div>
                <div class="custom-manage-search">
                    <input type="text" id="custom-manage-search" placeholder="搜索歌名或 BVID" autocomplete="off">
                </div>
                <div class="custom-manage-list" id="custom-manage-list"></div>
            </div>
        </div>

        <!-- 添加/编辑 自定义歌曲 表单弹窗 -->
        <div class="custom-form-backdrop" id="custom-form-backdrop">
            <div class="custom-form-box" id="custom-form-box">
                <h4 id="custom-form-title">添加自定义歌曲</h4>
                <label>歌名</label>
                <input type="text" id="custom-form-name" placeholder="请输入歌名" autocomplete="off">
                <label>BVID</label>
                <input type="text" id="custom-form-bvid" placeholder="BVxxxxxxxxxx" autocomplete="off">
                <div class="custom-form-lyrics-label-row">
                    <label class="custom-form-label-optional">歌词 <span class="label-optional">（可选，LRC 格式）</span></label>
                    <button type="button" class="btn-import-lrc" id="custom-form-lyrics-import-btn" title="从文件导入">导入文件</button>
                    <input type="file" id="custom-form-lyrics-file-input" accept=".lrc,.txt" style="display:none;">
                </div>
                <textarea id="custom-form-lyrics" placeholder="[00:00.00] 第一行歌词&#10;[00:05.00] 第二行歌词&#10;留空则不添加歌词" autocomplete="off" spellcheck="false"></textarea>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="custom-form-cancel">取消</button>
                    <button type="button" class="btn-submit" id="custom-form-submit">确定</button>
                </div>
            </div>
        </div>

        <!-- 定时关闭 弹窗 -->
        <div class="sleep-timer-backdrop" id="sleep-timer-backdrop">
            <div class="sleep-timer-box" id="sleep-timer-box">
                <h4>设定定时关闭</h4>
                <div class="sleep-timer-input-row">
                    <input type="number" id="sleep-hours-input" min="0" max="24" placeholder="0"> 小时
                    <input type="number" id="sleep-minutes-input" min="0" max="59" placeholder="0"> 分钟
                </div>
                <div class="sleep-timer-presets">
                    <button type="button" class="sleep-timer-preset" data-minutes="15">15 mins</button>
                    <button type="button" class="sleep-timer-preset" data-minutes="30">30 mins</button>
                    <button type="button" class="sleep-timer-preset" data-minutes="45">45 mins</button>
                    <button type="button" class="sleep-timer-preset" data-minutes="60">60 mins</button>
                </div>
                <div class="sleep-timer-actions">
                    <button type="button" class="sleep-timer-btn-cancel" id="sleep-timer-cancel">取消</button>
                    <button type="button" class="sleep-timer-btn-confirm" id="sleep-timer-confirm">设定</button>
                </div>
            </div>
        </div>

        <!-- 更新日志弹层 -->
        <div class="changelog-backdrop" id="changelog-backdrop">
            <div class="changelog-panel">
                <div class="changelog-header">更新日志<button type="button" class="panel-close-btn" id="btn-close-changelog" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                <div class="changelog-body">
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast" aria-live="polite" role="status"></div>
    <div id="loading-info" class="loading-info" aria-live="polite" role="status"></div>
